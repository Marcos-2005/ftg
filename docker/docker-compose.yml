version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: repdis-local
    restart: always
    environment:
      MYSQL_DATABASE: proy_repdis
      MYSQL_USER: root
      MYSQL_PASSWORD: alumno
      MYSQL_ROOT_PASSWORD: alumno
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - repdis-net

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - repdis-net

volumes:
  mysql_data:  # Esto es la clave

networks:
  repdis-net:
    driver: bridge
